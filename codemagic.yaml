workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Fix iOS project
        script: |
          rm -rf ios/Runner.xcodeproj
          flutter create --platforms=ios .
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          cd ..
      - name: Flutter build iOS archive
        script: |
          flutter build ios --release --no-codesign
      - name: Create IPA from archive
        script: |
          cd build/ios/archive
          xcodebuild -exportArchive \
            -archivePath Runner.xcarchive \
            -exportPath . \
            -exportOptionsPlist /dev/null \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO || true
          # Create IPA manually if export failed
          if [ ! -f "Runner.ipa" ]; then
            mkdir -p Payload
            cp -r Runner.xcarchive/Products/Applications/Runner.app Payload/
            zip -r Runner.ipa Payload
            rm -rf Payload
          fi
          cd ../../..
    artifacts:
      - build/ios/archive/*.ipa
      - build/ios/archive/Runner.xcarchive
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: false
