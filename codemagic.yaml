workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Fix iOS project
        script: |
          rm -rf ios/Runner.xcodeproj
          flutter create --platforms=ios .
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          cd ..
      - name: Flutter build iOS archive
        script: |
          flutter build ios --release --no-codesign
      - name: Create IPA from archive
        script: |
          ARCHIVE_PATH="build/ios/archive/Runner.xcarchive"
          if [ -d "$ARCHIVE_PATH" ]; then
            cd build/ios/archive
            # Create IPA manually from xcarchive
            mkdir -p Payload
            if [ -d "Runner.xcarchive/Products/Applications/Runner.app" ]; then
              cp -r Runner.xcarchive/Products/Applications/Runner.app Payload/
            elif [ -d "../Runner.app" ]; then
              cp -r ../Runner.app Payload/
            else
              echo "Runner.app not found, searching..."
              find . -name "Runner.app" -type d | head -1 | xargs -I {} cp -r {} Payload/
            fi
            zip -r Runner.ipa Payload
            rm -rf Payload
            cd ../../..
          else
            echo "Archive not found at $ARCHIVE_PATH"
            # Try alternative location
            if [ -d "build/ios/iphoneos/Runner.app" ]; then
              mkdir -p build/ios/archive/Payload
              cp -r build/ios/iphoneos/Runner.app build/ios/archive/Payload/
              cd build/ios/archive
              zip -r Runner.ipa Payload
              rm -rf Payload
              cd ../../..
            fi
          fi
    artifacts:
      - build/ios/archive/*.ipa
      - build/ios/archive/Runner.xcarchive
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: false
